<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>芯宠 spike</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent; /* 关键：body 也要透明 */
        overflow: hidden;
        user-select: none;
        -webkit-app-region: no-drag; /* 不要用 CSS 拖拽，会吞掉点击 */
      }

      #pet {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 160px;
        height: 160px;
        margin: -80px 0 0 -80px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffd1dc, #f06a8a 65%, #c94f70);
        box-shadow: 0 10px 30px rgba(201, 79, 112, 0.45),
          inset 0 -8px 20px rgba(0, 0, 0, 0.12);
        cursor: grab;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 600 15px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #fff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        transition: transform 120ms ease;
      }

      #pet.dragging {
        cursor: grabbing;
        transform: scale(0.94);
      }

      /* 呼吸：纯 transform，不触发重排 */
      #pet.breathe {
        animation: breathe 3s ease-in-out infinite;
      }

      @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }

      #hint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 4px;
        text-align: center;
        font: 11px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif;
        color: rgba(255, 255, 255, 0.85);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="pet" class="breathe">芯宠</div>
    <div id="hint">拖动我 / 透明区可穿透</div>
    <script src="./renderer.js"></script>
  </body>
</html>
