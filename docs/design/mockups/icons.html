<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>芯宠 · 图标系统</title>
<style>
  :root { --ink:#2a211c; --muted:#8a7b6e; --coral:#e8663c; --paper:#faf6ee; --line:#e6dccd; --mint:#2f9e8f; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:900px; height:660px; overflow:hidden; }
  body { background: var(--paper); color: var(--ink); font-family:"Segoe UI","Microsoft YaHei",sans-serif; padding:34px 38px; }
  .head { display:flex; align-items:flex-end; gap:16px; border-bottom:2px solid var(--ink); padding-bottom:12px; }
  .head h1 { margin:0; font-size:26px; letter-spacing:-.02em; }
  .head .sub { margin-left:auto; font-size:10px; color:var(--muted); letter-spacing:.08em; text-align:right; line-height:1.7; }
  .intro { display:flex; gap:20px; align-items:center; margin:18px 0 20px; }
  .logo { width:64px; height:64px; border-radius:16px; background:linear-gradient(145deg,var(--coral),#ff9a6b); color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:800; box-shadow:0 8px 18px rgba(232,102,60,.24); flex:0 0 64px; }
  .intro p { margin:0; font-size:12px; line-height:1.8; color:var(--muted); max-width:600px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .tile { background:#fffdf8; border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; align-items:center; gap:12px; }
  .tile .box { width:48px; height:48px; border-radius:12px; background:#f3ece2; display:flex; align-items:center; justify-content:center; color:var(--coral); flex:0 0 48px; }
  .tile .box svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .tile .box svg .solid { fill:currentColor; stroke:none; }
  .tile .name { font-size:12px; font-weight:600; }
  .tile .use { font-size:9px; color:var(--muted); margin-top:3px; }
  .foot { margin-top:18px; border-top:1px solid var(--line); padding-top:10px; display:flex; gap:18px; font-size:9px; color:var(--muted); letter-spacing:.04em; }
  .sw { display:flex; gap:5px; margin-left:auto; }
  .sw i { width:16px; height:16px; border-radius:50%; display:block; border:1px solid rgba(0,0,0,.12); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-paw" viewBox="0 0 24 24"><ellipse cx="7" cy="8" rx="2" ry="2.6" class="solid"/><ellipse cx="12" cy="6.4" rx="2" ry="2.8" class="solid"/><ellipse cx="17" cy="8" rx="2" ry="2.6" class="solid"/><path d="M12 11.2c-3.6 0-6.2 2.4-6.2 4.8 0 2 1.8 3.2 3.9 3.2 1 0 1.5-.5 2.3-.5s1.3.5 2.3.5c2.1 0 3.9-1.2 3.9-3.2 0-2.4-2.6-4.8-6.2-4.8Z" class="solid"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.7 5.1L19 10l-5.3 1.9L12 17l-1.7-5.1L5 10l5.3-1.9L12 3Z"/><path d="M18.5 14.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4v-5Z"/><path d="M16 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12"/></symbol>
  <symbol id="i-slider" viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M9 20h6M12 16.5V20"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10.5V17M12 7.4v.2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 12V6.5a1.5 1.5 0 0 1 3 0V11M11 10V5.2a1.5 1.5 0 0 1 3 0V10M14 10V6.6a1.5 1.5 0 0 1 3 0V13c0 4-2.4 6.5-6 6.5S6 17 6 13v-1.8a1.4 1.4 0 0 1 2.8 0V13"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 7.4 4.2 4.2 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5 8 8 0 1 0 19.5 14.5Z"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M3 12s3.4-5.5 9-5.5S21 12 21 12s-3.4 5.5-9 5.5S3 12 3 12Z"/><circle cx="12" cy="12" r="2.5"/></symbol>
</svg>

<div class="head">
  <h1>芯宠 · 图标系统</h1>
  <div class="sub">ICON SYSTEM / 24px grid<br />2px stroke · rounded caps</div>
</div>

<div class="intro">
  <div class="logo">芯</div>
  <p>图标统一采用 24×24 网格、2px 圆头描边，只在必要时用实心（爪印）。主色用于功能入口，次色用于状态；同一图标在浅色/深色下只换颜色，不换造型。</p>
</div>

<div class="grid">
  <div class="tile"><div class="box"><svg><use href="#i-paw"/></svg></div><div><div class="name">爪印</div><div class="use">我的形象</div></div></div>
  <div class="tile"><div class="box"><svg><use href="#i-spark"/></svg></div><div><div class="name">星芒</div><div class="use">外观大厅</div></div></div>
  <div class="tile"><div class="box"><svg><use href="#i-vol"/></svg></div><div><div class="name">音量</div><div class="use">声音与台词</div></div></div>
  <div class="tile"><div class="box"><svg><use href="#i-slider"/></svg></div><div><div class="name">滑杆</div><div class="use">行为</div></div></div>
  <div class="tile"><div class="box"><svg><use href="#i-monitor"/></svg></div><div><div class="name">显示器</div><div class="use">系统</div></div></div>
  <div class="tile"><div class="box"><svg><use href="#i-info"/></svg></div><div><div class="name">信息</div><div class="use">关于</div></div></div>
  <div class="tile"><div class="box"><svg><use href="#i-search"/></svg></div><div><div class="name">搜索</div><div class="use">查找形象</div></div></div>
  <div class="tile"><div class="box"><svg><use href="#i-plus"/></svg></div><div><div class="name">加号</div><div class="use">导入</div></div></div>
  <div class="tile"><div class="box"><svg><use href="#i-hand"/></svg></div><div><div class="name">招手</div><div class="use">动作</div></div></div>
  <div class="tile"><div class="box"><svg><use href="#i-heart"/></svg></div><div><div class="name">爱心</div><div class="use">摸头</div></div></div>
  <div class="tile"><div class="box"><svg><use href="#i-moon"/></svg></div><div><div class="name">月亮</div><div class="use">睡觉</div></div></div>
  <div class="tile"><div class="box"><svg><use href="#i-eye"/></svg></div><div><div class="name">眼睛</div><div class="use">显示 / 隐藏</div></div></div>
</div>

<div class="foot">
  <span>尺寸：24 / 20 / 16px</span><span>状态：默认 / 选中 / 禁用</span><span>浅色 &amp; 深色共用</span>
  <div class="sw"><i style="background:#e8663c"></i><i style="background:#2f9e8f"></i><i style="background:#2a211c"></i><i style="background:#f3ece2"></i></div>
</div>
</body>
</html>
