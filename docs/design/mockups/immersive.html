<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>芯宠 · 沉浸式形象库</title>
<link rel=stylesheet href=immersive.css />
<link rel="stylesheet" href="immersive-light.css" />
</head>
<body>
  <div class="atmo"></div>
  <div class="veil"></div>

  <div class="page">
    <header class="top">
      <div class="logo"><i>芯</i>芯宠</div>
      <nav class="tabs">
        <div class="tab active">我的形象</div>
        <div class="tab">外观大厅</div>
        <div class="tab">声音</div>
        <div class="tab">行为</div>
        <div class="tab">系统</div>
        <div class="tab">关于</div>
      </nav>
      <div class="grow"></div>
      <div class="icon-btn">⌕</div>
      <div class="icon-btn">⚙</div>
    </header>

    <div class="main">
      <div class="stage">
        <div class="tag">CURRENT COMPANION</div>
        <div class="halo"></div>
        <img src="assets/pet-shy.png" alt="" />
        <div class="floor"></div>
      </div>

      <aside class="info">
        <div class="kicker">01 / SHY</div>
        <h1>小芯</h1>
        <div class="sub">害羞 · 内置 · L3 36 帧</div>
        <p>说话轻轻的，喜欢被你摸头。今天想和你一起发呆，或者安静地待在屏幕角落。</p>
        <div class="chips">
          <span class="chip on">使用中</span>
          <span class="chip">粉色</span>
          <span class="chip">36 帧</span>
        </div>
        <div class="actions">
          <button class="btn primary">摸头</button>
          <button class="btn">招手</button>
          <button class="btn">隐藏</button>
        </div>
      </aside>
    </div>

    <div class="shelf-wrap">
      <div class="shelf-head">
        <h2>我的形象</h2>
        <div class="line"></div>
        <div class="hint">← → 切换 · ENTER 使用</div>
      </div>
      <div class="shelf">
        <div class="item active">
          <div class="tag">使用中</div>
          <img src="assets/pet-shy.png" alt="" />
          <div class="name">小芯</div>
        </div>
        <div class="item">
          <div class="tag">内置</div>
          <img src="assets/pet-cheerful.png" alt="" />
          <div class="name">阿橙</div>
        </div>
        <div class="item">
          <div class="tag">内置</div>
          <img src="assets/pet-tsundere.png" alt="" />
          <div class="name">桃桃</div>
        </div>
        <div class="item">
          <div class="tag">精选</div>
          <img src="assets/pet-cheerful.png" style="filter:hue-rotate(120deg) drop-shadow(0 10px 12px rgba(0,0,0,.4))" alt="" />
          <div class="name">薄荷汽水</div>
        </div>
        <div class="item">
          <div class="tag">精选</div>
          <img src="assets/pet-tsundere.png" style="filter:hue-rotate(260deg) drop-shadow(0 10px 12px rgba(0,0,0,.4))" alt="" />
          <div class="name">夜樱狐</div>
        </div>
        <div class="item">
          <div class="tag">导入</div>
          <img src="assets/pet-shy.png" style="filter:sepia(.4) drop-shadow(0 10px 12px rgba(0,0,0,.4))" alt="" />
          <div class="name">焦糖布丁</div>
        </div>
      </div>
      <div class="fade-left"></div>
      <div class="fade-right"></div>
    </div>
  </div>
<script>if (location.search.includes("light")) document.body.classList.add("light");</script>
</body>
</html>
