<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="mockup.css" />
<title>右键快捷面板</title>
</head>
<body class="panel">

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 12V6.5a1.5 1.5 0 0 1 3 0V11M11 10V5.2a1.5 1.5 0 0 1 3 0V10M14 10V6.6a1.5 1.5 0 0 1 3 0V13c0 4-2.4 6.5-6 6.5S6 17 6 13v-1.8a1.4 1.4 0 0 1 2.8 0V13"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 7.4 4.2 4.2 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5 8 8 0 1 0 19.5 14.5Z"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M3 12s3.4-5.5 9-5.5S21 12 21 12s-3.4 5.5-9 5.5S3 12 3 12Z"/><circle cx="12" cy="12" r="2.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</svg>

<div class="qp">
  <div class="qp-head">
    <div class="ava"><img src="assets/pet-shy.png" alt="" /></div>
    <div>
      <div class="nm">小芯</div>
      <div class="st"><span class="dot"></span>害羞 · 使用中</div>
    </div>
    <button class="x"><svg width="13" height="13"><use href="#i-x"/></svg></button>
  </div>

  <div class="qp-actions">
    <button class="qa"><svg class="ic"><use href="#i-hand"/></svg>招手</button>
    <button class="qa"><svg class="ic"><use href="#i-heart"/></svg>摸头</button>
    <button class="qa"><svg class="ic"><use href="#i-moon"/></svg>睡觉</button>
    <button class="qa"><svg class="ic"><use href="#i-eye"/></svg>隐藏</button>
  </div>

  <div class="qp-line"></div>

  <div class="qp-label">性格</div>
  <div class="seg">
    <button class="on">害羞</button>
    <button>开朗</button>
    <button>傲娇</button>
  </div>

  <div class="qp-label" style="margin-top:11px">音量</div>
  <div class="qp-vol">
    <div class="track"><div class="knob"></div></div>
    <div class="num">70%</div>
  </div>

  <div class="qp-toggles">
    <button class="tg">静音<span class="sw"></span></button>
    <button class="tg">勿扰<span class="sw"></span></button>
  </div>

  <div class="qp-foot">
    <button class="open">打开控制中心</button>
    <button class="quit">退出</button>
  </div>
</div>

<script>if (location.search.includes("dark")) document.body.classList.add("dark");</script>
</body>
</html>
